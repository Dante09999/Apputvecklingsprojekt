<svg xmlns="http://w3.org" width="420" height="45" viewBox="0 0 420 45">
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ff0000" />
      <stop offset="16%" stop-color="#ff8800" />
      <stop offset="33%" stop-color="#dddd00" />
      <stop offset="50%" stop-color="#00cc00" />
      <stop offset="66%" stop-color="#0066ff" />
      <stop offset="83%" stop-color="#8b00ff" />
      <stop offset="100%" stop-color="#ff0000" />
      <animateTransform 
        attributeName="gradientTransform" 
        type="translate" 
        from="0 0" 
        to="-1 0" 
        dur="3s" 
        repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="url(#rainbow)">
    Actively Changing Rainbow Text
  </text>
</svg>
